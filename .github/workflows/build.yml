# Builds unsigned Windows and macOS (Apple Silicon) binaries.
# Runs on version tags (v*) or manually. BRAW support is NOT included in
# CI builds because the Blackmagic RAW SDK cannot be redistributed here.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: cmd
        run: scripts\build_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: MiniMe-windows
          path: dist/*.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: bash scripts/build_mac.command
      - name: Zip app
        run: cd dist && for a in *.app; do ditto -c -k --keepParent "$a" "${a%.app}.zip"; done
      - uses: actions/upload-artifact@v4
        with:
          name: MiniMe-macos
          path: dist/*.zip
